<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Frida invites</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
:root { --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { padding: 40px 32px 80px; font-family: var(--ui); font-size: 14px; line-height: 1.5; color: #000; }
h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
h2 { font-size: 13px; font-weight: 500; margin: 34px 0 10px; text-transform: uppercase; letter-spacing: .08em; }
p { max-width: 62em; margin: 0 0 10px; }
.muted { color: #666; }
[hidden] { display: none !important; }

button, input, textarea { font-family: var(--ui); font-size: 13px; border-radius: 0; }
input[type=text], input[type=email], input[type=password], input[type=number], textarea {
  border: 1px solid #000; padding: 5px 8px; background: #fff; color: #000; line-height: 1;
}
input:focus, textarea:focus { outline: none; }
textarea { line-height: 1.45; width: 100%; max-width: 62em; resize: vertical; }
button {
  border: 1px solid #000; background: #000; color: #fff;
  padding: 5px 10px; line-height: 1; cursor: pointer; font-weight: 500;
}
button.ghost { background: #fff; color: #000; }
button:active { transform: translateY(1px); }
button[disabled] { opacity: .4; cursor: default; }

table { border-collapse: collapse; width: 100%; max-width: 62em; margin-top: 4px; }
th, td { border: 1px solid #000; padding: 5px 8px; text-align: left; vertical-align: middle; }
th { font-weight: 500; background: #f4f4f4; }
td.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; white-space: nowrap; }
td.n { width: 4em; }
td.act { width: 1%; white-space: nowrap; }
td.act button { margin-left: 4px; }
.empty { color: #666; padding: 10px 0; }

.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.row label { min-width: 9em; }
#letter { height: 280px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.ok { color: #060; }
.err { color: #b00020; }
#signin { max-width: 22em; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; max-width: 62em; }
</style>
</head>
<body>

<div class="bar">
  <h1>Frida invites</h1>
  <span><span class="muted" id="who"></span> <button class="ghost" id="signout" hidden>Sign out</button></span>
</div>
<p class="muted" id="lede">Sign in to manage invite codes.</p>

<!-- ------------------------------------------------------------- sign in -->
<form id="signin">
  <div class="row"><input type="email" id="email" placeholder="Email" autocomplete="username" required style="width:100%"></div>
  <div class="row"><input type="password" id="password" placeholder="Password" autocomplete="current-password" required style="width:100%"></div>
  <div class="row"><button type="submit" id="signin-go">Sign in</button> <span id="auth-msg" class="muted"></span></div>
</form>

<!-- ---------------------------------------------------------------- app -->
<div id="app" hidden>

  <h2>Invitation</h2>
  <div class="row">
    <label for="url">TestFlight link</label>
    <input type="text" id="url" size="46" placeholder="https://testflight.apple.com/join/…">
    <button id="save-url">Save</button>
  </div>

  <h2>People</h2>
  <div class="row">
    <input type="text" id="name" size="24" placeholder="Name" autocomplete="off">
    <label for="next" style="min-width:auto">as user #</label>
    <input type="number" id="next" min="1" step="1" style="width:5.5em">
    <button id="add">Add person</button>
    <button class="ghost" id="copy-all">Copy all codes</button>
  </div>
  <table id="table" hidden>
    <thead><tr><th class="n">#</th><th>Name</th><th>Code</th><th class="act"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty">No one yet. Add a person to generate their code.</p>

  <h2>Letter body</h2>
  <p class="muted">Shared by everyone. Only the heading is personalised. Leave <code>{{url}}</code> where the TestFlight link should go.</p>
  <textarea id="letter" spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px"><button id="save-letter">Save letter</button></div>

  <p class="muted" id="status" style="margin-top:18px"></p>
</div>

<script>
(function () {
  var URL_BASE = 'https://ccryphtpmhepxtfeggpa.supabase.co',
      ANON = 'sb_publishable_QL7BFGPuIrPlaOehmyPOrA_ss6cVIHe',
      SESSION = 'frida.admin.session',
      ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no I O 0 1

  var $ = function (id) { return document.getElementById(id); };
  var session = null, invites = [], config = {};

  try { session = JSON.parse(localStorage.getItem(SESSION) || 'null'); } catch (e) {}

  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION, JSON.stringify(s));
      else localStorage.removeItem(SESSION);
    } catch (e) {}
  }

  function status(msg, cls) { $('status').textContent = msg; $('status').className = cls || 'muted'; }
  function authMsg(msg, cls) { $('auth-msg').textContent = msg; $('auth-msg').className = cls || 'muted'; }

  // ---- transport ----------------------------------------------------------
  function auth(path, payload) {
    return fetch(URL_BASE + '/auth/v1/' + path, {
      method: 'POST',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function refresh() {
    if (!session || !session.refresh_token) return Promise.reject(new Error('no session'));
    return auth('token?grant_type=refresh_token', { refresh_token: session.refresh_token })
      .then(function (s) { saveSession(s); return s; });
  }

  // PostgREST call, retried once after a token refresh.
  function db(path, opts, retried) {
    opts = opts || {};
    var headers = {
      'apikey': ANON,
      'Authorization': 'Bearer ' + (session && session.access_token),
      'Content-Type': 'application/json'
    };
    if (opts.prefer) headers['Prefer'] = opts.prefer;
    return fetch(URL_BASE + '/rest/v1/' + path, {
      method: opts.method || 'GET', headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.status === 401 && !retried) {
        return refresh().then(function () { return db(path, opts, true); });
      }
      if (!r.ok) {
        return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
      }
      return r.status === 204 ? null : r.json();
    });
  }

  // ---- helpers ------------------------------------------------------------
  function newCode() {
    var b = new Uint8Array(10), out = '';
    crypto.getRandomValues(b);
    for (var i = 0; i < 10; i++) out += ALPHA[b[i] % ALPHA.length];
    return out;
  }
  function pretty(code) { return code.slice(0, 5) + '-' + code.slice(5); }
  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function copy(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status(msg, 'ok'); },
                                              function () { status('Could not copy.', 'err'); });
    } else { status('Clipboard unavailable in this browser.', 'err'); }
  }

  // ---- rendering ----------------------------------------------------------
  function render() {
    var rows = $('rows');
    rows.textContent = '';
    invites.forEach(function (p) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="n"></td><td></td><td class="code"></td>' +
        '<td class="act"><button class="ghost" data-copy="' + p.id + '">Copy</button>' +
        '<button class="ghost" data-del="' + p.id + '">Delete</button></td>';
      tr.children[0].textContent = p.ordinal;
      tr.children[1].textContent = p.name;
      tr.children[2].textContent = pretty(p.code);
      rows.appendChild(tr);
    });
    $('table').hidden = !invites.length;
    $('empty').hidden = !!invites.length;

    var max = invites.reduce(function (m, p) { return Math.max(m, p.ordinal); }, 0);
    if (document.activeElement !== $('next')) $('next').value = max + 1;
  }

  function showApp(on, email) {
    $('app').hidden = !on;
    $('signin').hidden = on;
    $('signout').hidden = !on;
    $('who').textContent = on ? (email || '') : '';
    $('lede').textContent = on
      ? 'Changes are live the moment you save — no deploy needed.'
      : 'Sign in to manage invite codes.';
  }

  function loadAll() {
    return Promise.all([
      db('invites?select=id,name,ordinal,code&order=ordinal.asc'),
      db('app_config?select=key,value')
    ]).then(function (res) {
      invites = res[0] || [];
      config = {};
      (res[1] || []).forEach(function (r) { config[r.key] = r.value; });
      $('url').value = config.testflight_url || '';
      $('letter').value = config.letter_body || '';
      render();
    });
  }

  function start(email) {
    showApp(true, email);
    status('Loading…');
    return loadAll().then(function () { status(''); }).catch(function (e) {
      status('Could not load: ' + e.message + ' — is your user in the admins table?', 'err');
    });
  }

  // ---- events -------------------------------------------------------------
  $('signin').addEventListener('submit', function (e) {
    e.preventDefault();
    authMsg('Signing in…');
    $('signin-go').disabled = true;
    auth('token?grant_type=password', { email: $('email').value.trim(), password: $('password').value })
      .then(function (s) {
        saveSession(s);
        $('password').value = '';
        authMsg('');
        $('signin-go').disabled = false;
        return start(s.user && s.user.email);
      })
      .catch(function (err) { $('signin-go').disabled = false; authMsg(err.message, 'err'); });
  });

  $('signout').addEventListener('click', function () {
    saveSession(null);
    invites = []; config = {};
    showApp(false);
  });

  $('save-url').addEventListener('click', function () {
    var v = $('url').value.trim();
    db('app_config?on_conflict=key', {
      method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
      body: [{ key: 'testflight_url', value: v, updated_at: new Date().toISOString() }]
    }).then(function () { config.testflight_url = v; status('TestFlight link saved.', 'ok'); })
      .catch(function (e) { status('Save failed: ' + e.message, 'err'); });
  });

  $('save-letter').addEventListener('click', function () {
    var v = $('letter').value;
    db('app_config?on_conflict=key', {
      method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
      body: [{ key: 'letter_body', value: v, updated_at: new Date().toISOString() }]
    }).then(function () { config.letter_body = v; status('Letter saved.', 'ok'); })
      .catch(function (e) { status('Save failed: ' + e.message, 'err'); });
  });

  $('add').addEventListener('click', function () {
    var name = $('name').value.trim(), ord = parseInt($('next').value, 10);
    if (!name) { $('name').focus(); return; }
    if (!(ord > 0)) { $('next').focus(); return; }
    var code = newCode();
    db('invites', {
      method: 'POST', prefer: 'return=representation',
      body: [{ name: name, ordinal: ord, code: code }]
    }).then(function (created) {
      invites.push(created[0]);
      invites.sort(function (a, b) { return a.ordinal - b.ordinal; });
      $('name').value = '';
      render();
      $('name').focus();
      status(name + ' added as the ' + ordinal(ord) + ' user. Code ' + pretty(code) + '.', 'ok');
    }).catch(function (e) { status('Could not add: ' + e.message, 'err'); });
  });

  $('name').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('add').click(); }
  });

  $('rows').addEventListener('click', function (e) {
    var del = e.target.getAttribute('data-del'), cp = e.target.getAttribute('data-copy');
    var find = function (id) { return invites.filter(function (p) { return p.id === id; })[0]; };
    if (del) {
      var p = find(del);
      if (!p || !confirm('Delete ' + p.name + '? Their code stops working immediately.')) return;
      db('invites?id=eq.' + encodeURIComponent(del), { method: 'DELETE', prefer: 'return=minimal' })
        .then(function () {
          invites = invites.filter(function (x) { return x.id !== del; });
          render();
          status('Removed ' + p.name + '.', 'ok');
        }).catch(function (err) { status('Delete failed: ' + err.message, 'err'); });
    } else if (cp) {
      var q = find(cp);
      if (q) copy(pretty(q.code), 'Copied ' + q.name + '’s code.');
    }
  });

  $('copy-all').addEventListener('click', function () {
    if (!invites.length) return;
    copy(invites.map(function (p) {
      return p.name + '\t' + ordinal(p.ordinal) + '\t' + pretty(p.code);
    }).join('\n'), 'Copied ' + invites.length + ' codes.');
  });

  // ---- boot ---------------------------------------------------------------
  if (session && session.access_token) {
    showApp(true, session.user && session.user.email);
    loadAll().then(function () { status(''); }).catch(function () {
      return refresh().then(function (s) { return start(s.user && s.user.email); })
        .catch(function () { saveSession(null); showApp(false); });
    });
  } else {
    showApp(false);
  }
})();
</script>

</body>
</html>
