<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonyCompany Inc</title>
<meta name="description" content="MonyCompany Inc builds agentic interfaces with minimalistic complexity.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #000000;
  --gutter: clamp(24px, 6vw, 96px);
  --measure: 1360px;
  --hairline: #ededed;
  --pill-bg: #f1f1f1;
  --pill-ink: #4a4a4a;
  --placeholder: #f1f1f1;
  --column: 640px;
  --section-gap: clamp(64px, 14vh, 160px);
  --radius: 14px;
  --step: 18ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-optical-sizing: auto;
  font-synthesis-weight: none;
  -webkit-font-smoothing: antialiased;
}

.mark {
  padding-block: clamp(28px, 5vh, 48px) 0;
  padding-inline: var(--gutter);
  text-align: center;
  font-size: 0.9375rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1;
}

.hero {
  max-width: var(--measure);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: clamp(40px, 9vh, 96px) 0;
  text-align: center;
}

/* Quiet announcement above the line: grey enough to sit behind the
   headline, dark enough to stay legible on its own ground. */
.pill {
  display: inline-block;
  margin: 0 0 clamp(12px, 2vh, 18px);
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--pill-ink);
  font-size: 0.8125rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1;
}

/* Inter wants real negative tracking even at this size. */
.hero h1 {
  margin: 0;
  font-size: clamp(1.5rem, 3.2vw, 2.75rem);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.025em;
}

/* Deterministic break at the grammatical seam; natural wrap once narrow. */
@media (max-width: 719px) {
  .hero h1 br { display: none; }
}

/* Well short of the column, so it reads as a clip sitting on the page
   rather than a band across it. The wrapper carries the frame: Safari is
   unreliable about clipping a video to its own border-radius. */
.reel {
  width: 100%;
  max-width: var(--column);
  margin: clamp(40px, 9vh, 96px) auto 0;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  overflow: hidden;
}

.reel video {
  display: block;
  width: 100%;
  height: auto;
}

/* One page-load sequence: the line resolves letter by letter, then the
   clip settles in behind it. Split into words so wrapping still works. */
.hero h1 .w { display: inline-block; white-space: nowrap; }
.hero h1 .c { display: inline-block; }

@keyframes settle {
  from { opacity: 0; filter: blur(12px); }
  to   { opacity: 1; filter: blur(0); }
}

.is-animated .mark {
  animation: settle 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

.is-animated .pill {
  animation: settle 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc(2 * var(--step));
}

.is-animated .hero h1 .c {
  animation: settle 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc((var(--i) + 6) * var(--step));
}

.is-animated .products {
  animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc((var(--n) + 10) * var(--step));
}

.is-animated .reel {
  animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc((var(--n) + 6) * var(--step));
}

/* ---- Our Products ---------------------------------------------------- */

.products {
  max-width: var(--measure);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: var(--section-gap);
}

.products h2 {
  margin: 0 0 var(--section-gap);
  text-align: center;
  font-size: clamp(1.125rem, 2vw, 1.5rem);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

/* Two across on the same column the clip sits on. */
.product-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(12px, 2.5vw, 20px);
  max-width: var(--column);
  margin: 0 auto;
}

/* Both shots are white-ground mockups, so the hairline is what gives the
   cards an edge against the paper -- same rule the clip carries. */
.product {
  aspect-ratio: 2224 / 1300;
  background: var(--placeholder);
  border: 1px solid var(--hairline);
  overflow: hidden;
}

.product img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>

<header class="mark">Mony</header>

<section class="hero">
  <div class="pill">Frida TestFlight Access</div>
  <h1>We build agentic interfaces <br>with minimalistic complexity</h1>
  <div class="reel">
    <video src="assets/frida2.mp4" width="1846" height="1078" autoplay muted loop playsinline preload="metadata" disablepictureinpicture></video>
  </div>
</section>

<section class="products">
  <h2>Products We’ve Built</h2>
  <div class="product-row">
    <div class="product">
      <img src="assets/fridaphoto.png" width="1000" height="585" loading="lazy" decoding="async" alt="Frida answering a question about churches in Paris on iPhone">
    </div>
    <div class="product">
      <img src="assets/soffophoto.png" width="1000" height="585" loading="lazy" decoding="async" alt="Soffo engineering workspace with an agent task list">
    </div>
  </div>
</section>

<script>
(function () {
  var h1 = document.querySelector('.hero h1');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    for (var v of document.querySelectorAll('video')) {
      v.removeAttribute('autoplay');
      v.controls = true;
      v.pause();
    }
    return;
  }

  if (!h1) return;

  var nodes = Array.prototype.slice.call(h1.childNodes);
  var out = document.createDocumentFragment();
  var i = 0;

  for (var node of nodes) {
    if (node.nodeName === 'BR') { out.appendChild(node); continue; }

    for (var part of node.textContent.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { out.appendChild(document.createTextNode(part)); continue; }

      var word = document.createElement('span');
      word.className = 'w';
      for (var ch of part) {
        var c = document.createElement('span');
        c.className = 'c';
        c.style.setProperty('--i', i++);
        c.textContent = ch;
        word.appendChild(c);
      }
      out.appendChild(word);
    }
  }

  h1.textContent = '';
  h1.appendChild(out);
  document.body.style.setProperty('--n', i);
  document.body.classList.add('is-animated');
})();
</script>

</body>
</html>
