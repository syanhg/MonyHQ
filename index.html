<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonyCompany Inc</title>
<meta name="description" content="MonyCompany Inc builds agentic interfaces with minimalistic complexity.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #000000;
  --gutter: clamp(24px, 6vw, 96px);
  --measure: 1360px;
  --hairline: #ededed;
  --pill-bg: #f1f1f1;
  --pill-ink: #4a4a4a;
  --placeholder: #f1f1f1;
  --column: 640px;
  --section-gap: clamp(64px, 14vh, 160px);
  --radius: 14px;
  --step: 18ms;
  --contact-bg: #423d3a;
  --contact-bg-hover: #2f2b29;
  --contact-ink: #fbf3ee;
  --key-bg: #a69d9a;
  --key-ink: #423d3a;
  color-scheme: light;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-optical-sizing: auto;
  font-synthesis-weight: none;
  -webkit-font-smoothing: antialiased;
}

/* ---- Masthead -------------------------------------------------------- */

/* Sits above the hero: every animated piece there ends up on its own
   layer, and the products panel has to open over them. */
.masthead {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: var(--measure);
  margin: 0 auto;
  padding-block: clamp(20px, 4vh, 36px) 0;
  padding-inline: var(--gutter);
}

.mark {
  color: var(--ink);
  font-size: 1.0625rem;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  text-decoration: none;
}

.nav {
  display: flex;
  align-items: center;
  gap: 6px;
}

.menu-trigger,
.contact {
  display: inline-flex;
  align-items: center;
  height: 32px;
  border: 0;
  border-radius: 5px;
  font: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 160ms ease;
}

/* No ring: keyboard focus shows as the hover fill instead. */
.mark:focus,
.menu-trigger:focus,
.contact:focus,
.menu-panel a:focus { outline: none; }

.menu { position: relative; }

.menu-trigger {
  gap: 6px;
  padding: 0 10px;
  background: transparent;
  color: var(--ink);
}

.menu-trigger:hover,
.menu-trigger:focus-visible,
.menu[data-open] .menu-trigger { background: var(--placeholder); }

.menu-trigger svg { display: block; transition: transform 200ms ease; }
.menu[data-open] .menu-trigger svg { transform: rotate(180deg); }

/* Exactly as wide as the trigger; the labels line up under its own.
   visibility keeps the closed links out of the tab order. */
.menu-panel {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  padding: 4px;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.18);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: opacity 160ms ease, transform 160ms ease, visibility 0s linear 160ms;
}

.menu[data-open] .menu-panel {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity 160ms ease, transform 160ms ease;
}

.menu-panel a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 5px;
  border-radius: 4px;
  color: var(--ink);
  font-size: 0.875rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.2;
  text-decoration: none;
  transition: background-color 160ms ease;
}

.menu-panel a:hover,
.menu-panel a:focus-visible { background: var(--placeholder); }

.contact {
  gap: 8px;
  padding: 0 8px 0 12px;
  background: var(--contact-bg);
  color: var(--contact-ink);
}

.contact:hover,
.contact:focus-visible { background: var(--contact-bg-hover); }

.nav kbd {
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 3px;
  background: var(--key-bg);
  color: var(--key-ink);
  font: inherit;
  font-size: 0.6875rem;
  font-weight: 600;
  line-height: 1;
}

/* On the white panel the keys go light; they darken a step with the row
   so they don't dissolve into its hover fill. */
.menu-panel kbd {
  background: #efefef;
  color: #6b6b6b;
  transition: background-color 160ms ease;
}

.menu-panel a:hover kbd,
.menu-panel a:focus-visible kbd { background: #e2e2e2; }

/* No keyboard to press it with. */
@media (hover: none) {
  .contact { padding-right: 12px; }
  .nav kbd { display: none; }
}

.hero {
  max-width: var(--measure);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: clamp(40px, 9vh, 96px) 0;
  text-align: center;
}

/* Quiet announcement above the line: grey enough to sit behind the
   headline, dark enough to stay legible on its own ground. */
.pill {
  display: inline-block;
  margin: 0 0 clamp(12px, 2vh, 18px);
  padding: 7px 12px;
  border-radius: 5px;
  background: var(--pill-bg);
  color: var(--pill-ink);
  font-size: 0.8125rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1;
}

/* Inter wants real negative tracking even at this size. */
.hero h1 {
  margin: 0;
  font-size: clamp(1.375rem, 2.8vw, 2.375rem);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.025em;
}

/* Deterministic break at the grammatical seam; natural wrap once narrow. */
@media (max-width: 719px) {
  .hero h1 br { display: none; }
}

/* Well short of the column, so it reads as a clip sitting on the page
   rather than a band across it. The wrapper carries the frame: Safari is
   unreliable about clipping a video to its own border-radius. */
.reel {
  width: 100%;
  max-width: var(--column);
  margin: clamp(40px, 9vh, 96px) auto 0;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  overflow: hidden;
}

.reel video {
  display: block;
  width: 100%;
  height: auto;
}

/* One page-load sequence: the line resolves letter by letter, then the
   clip settles in behind it. Split into words so wrapping still works. */
.hero h1 .w { display: inline-block; white-space: nowrap; }
.hero h1 .c { display: inline-block; }

@keyframes settle {
  from { opacity: 0; filter: blur(12px); }
  to   { opacity: 1; filter: blur(0); }
}

.is-animated .masthead {
  animation: settle 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

.is-animated .pill {
  animation: settle 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc(2 * var(--step));
}

.is-animated .hero h1 .c {
  animation: settle 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc((var(--i) + 6) * var(--step));
}

.is-animated .products,
.is-animated footer {
  animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc((var(--n) + 10) * var(--step));
}

.is-animated .reel {
  animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc((var(--n) + 6) * var(--step));
}

/* ---- Our Products ---------------------------------------------------- */

.products {
  max-width: var(--measure);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: var(--section-gap);
}

section h2 {
  margin: 0 0 var(--section-gap);
  text-align: center;
  font-size: clamp(1.125rem, 2vw, 1.5rem);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

section h2:last-child { margin-bottom: 0; }

/* Two across on the same column the clip sits on. */
.product-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(12px, 2.5vw, 20px);
  max-width: var(--column);
  margin: 0 auto;
}

/* Both shots are white-ground mockups, so the hairline is what gives the
   frame an edge against the paper -- same rule the clip carries. */
.shot {
  aspect-ratio: 2224 / 1300;
  background: var(--placeholder);
  border: 1px solid var(--hairline);
  overflow: hidden;
}

.shot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: clamp(10px, 1.6vh, 14px);
}

.name {
  font-size: 0.9375rem;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.explore {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  padding: 6px 11px;
  border: 0;
  border-radius: 5px;
  background: var(--placeholder);
  color: var(--ink);
  font-size: 0.8125rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1;
  text-decoration: none;
  transition: background-color 160ms ease;
}

.explore svg { display: block; }
.explore:hover { background: #e7e7e7; }
.explore:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

footer {
  padding-inline: var(--gutter);
  padding-bottom: clamp(32px, 6vh, 56px);
  text-align: center;
  font-size: 0.8125rem;
  letter-spacing: -0.005em;
  color: var(--pill-ink);
}
</style>
</head>
<body>

<header class="masthead">
  <a class="mark" href="./">Mony</a>
  <nav class="nav" aria-label="Main">
    <div class="menu">
      <button class="menu-trigger" type="button" aria-expanded="false" aria-controls="products-menu">Products <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="menu-panel" id="products-menu">
        <a href="https://frida.chat/" aria-keyshortcuts="F">Frida <kbd aria-hidden="true">F</kbd></a>
        <a href="https://getsoffo.com/" aria-keyshortcuts="S">Soffo <kbd aria-hidden="true">S</kbd></a>
      </div>
    </div>
    <a class="contact" href="mailto:alex@mony.company" aria-keyshortcuts="C">Contact <kbd aria-hidden="true">C</kbd></a>
  </nav>
</header>

<section class="hero">
  <div class="pill">Frida TestFlight Access</div>
  <h1>An agentic interface that moves <br>with the ease and rhythm of flowing water</h1>
  <div class="reel">
    <video src="assets/frida.mp4" width="1280" height="720" autoplay muted loop playsinline preload="metadata" disablepictureinpicture></video>
  </div>
</section>

<section class="products">
  <h2>Products We’ve Built</h2>
  <div class="product-row">
    <article class="product">
      <div class="shot">
        <img src="assets/fridaphoto.png" width="1000" height="585" loading="lazy" decoding="async" alt="Frida answering a question about churches in Paris on iPhone">
      </div>
      <div class="meta">
        <span class="name">Frida</span>
        <a class="explore" href="https://frida.chat/" aria-label="Explore Frida">Explore <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 6h7M6.5 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </article>
    <article class="product">
      <div class="shot">
        <img src="assets/soffophoto.png" width="1000" height="585" loading="lazy" decoding="async" alt="Soffo engineering workspace with an agent task list">
      </div>
      <div class="meta">
        <span class="name">Soffo</span>
        <a class="explore" href="https://getsoffo.com/" aria-label="Explore Soffo">Explore <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 6h7M6.5 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </article>
  </div>
</section>

<footer>© 2026 MonyCompany Inc. All rights reserved.</footer>

<script>
(function () {
  var menu = document.querySelector('.menu');
  var trigger = menu.querySelector('.menu-trigger');
  var contact = document.querySelector('.contact');
  var mark = document.querySelector('.mark');

  // There is only the one page, so home means the top of it. A plain
  // click glides back up; modified clicks still open the link itself.
  mark.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' });
  });

  function setOpen(open) {
    menu.toggleAttribute('data-open', open);
    trigger.setAttribute('aria-expanded', String(open));
  }

  trigger.addEventListener('click', function () {
    setOpen(!menu.hasAttribute('data-open'));
  });

  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target)) setOpen(false);
  });

  menu.addEventListener('focusout', function (e) {
    if (!menu.contains(e.relatedTarget)) setOpen(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.hasAttribute('data-open')) {
      setOpen(false);
      trigger.focus();
      return;
    }

    // The letters on the keys are real shortcuts: C anywhere, and F and S
    // for the products while their panel is open.
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    var key = e.key.length === 1 ? e.key.toUpperCase() : '';
    if (!/^[A-Z]$/.test(key)) return;
    var t = e.target;
    if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;

    var link = menu.hasAttribute('data-open') && menu.querySelector('.menu-panel [aria-keyshortcuts="' + key + '"]');
    if (!link && key === 'C') link = contact;
    if (link) link.click();
  });
})();

(function () {
  var h1 = document.querySelector('.hero h1');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    for (var v of document.querySelectorAll('video')) {
      v.removeAttribute('autoplay');
      v.controls = true;
      v.pause();
    }
    return;
  }

  if (!h1) return;

  var nodes = Array.prototype.slice.call(h1.childNodes);
  var out = document.createDocumentFragment();
  var i = 0;

  for (var node of nodes) {
    if (node.nodeName === 'BR') { out.appendChild(node); continue; }

    for (var part of node.textContent.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { out.appendChild(document.createTextNode(part)); continue; }

      var word = document.createElement('span');
      word.className = 'w';
      for (var ch of part) {
        var c = document.createElement('span');
        c.className = 'c';
        c.style.setProperty('--i', i++);
        c.textContent = ch;
        word.appendChild(c);
      }
      out.appendChild(word);
    }
  }

  h1.textContent = '';
  h1.appendChild(out);
  document.body.style.setProperty('--n', i);
  document.body.classList.add('is-animated');
})();
</script>

</body>
</html>
