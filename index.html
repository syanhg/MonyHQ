<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonyCompany Inc</title>
<meta name="description" content="MonyCompany Inc builds agentic interfaces with minimalistic complexity.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #000000;
  --placeholder: #ebebeb;
  --gutter: clamp(24px, 6vw, 96px);
  --measure: 1360px;
  color-scheme: light;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-optical-sizing: auto;
  font-synthesis-weight: none;
  -webkit-font-smoothing: antialiased;
}

.hero {
  max-width: var(--measure);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: clamp(96px, 22vh, 240px) clamp(64px, 14vh, 160px);
  text-align: center;
}

/* The one loud thing on the page. Inter wants real negative tracking at
   display sizes; the block is sized to sit just inside the column. */
.hero h1 {
  margin: 0;
  font-size: clamp(2.125rem, 5.2vw, 4.75rem);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.038em;
}

/* Deterministic break at the grammatical seam; natural wrap once narrow. */
@media (max-width: 719px) {
  .hero h1 br { display: none; }
}

.placeholder {
  margin-top: clamp(48px, 11vh, 128px);
  aspect-ratio: 16 / 9;
  background: var(--placeholder);
}
</style>
</head>
<body>

<section class="hero">
  <h1>We build agentic interfaces <br>with minimalistic complexity.</h1>
  <div class="placeholder"></div>
</section>

</body>
</html>
